<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mustache Pods — Premium Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #09090b;
      --bg-card: #141417;
      --border: #27272a;
      --text: #f4f4f5;
      --text-dim: #a1a1aa;
      --accent: #00d4aa;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }

    header { position: sticky; top: 0; z-index: 99; background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    .nav { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; }
    .logo { font-size: 22px; font-weight: 700; color: var(--text); text-decoration: none; }
    .logo span { color: var(--accent); }
    .nav-actions { display: flex; align-items: center; gap: 12px; }

    .btn-auth-trigger { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: var(--radius-sm); cursor: pointer; }
    .cart-trigger { background: var(--bg-card); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: var(--radius-sm); cursor: pointer; }

    .hero { max-width: 1200px; margin: 40px auto; padding: 60px 20px; text-align: center; border: 1px solid var(--border); border-radius: var(--radius-lg); background: #18181b; }
    .hero h1 { font-size: 48px; margin-bottom: 16px; }
    .hero p { color: var(--text-dim); max-width: 600px; margin: 0 auto; }

    main { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
    .card-title { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
    .price { color: var(--accent); font-weight: 700; font-size: 20px; margin: 12px 0; }
    .btn-add { width: 100%; background: var(--text); color: var(--bg); border: none; padding: 12px; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <nav class="nav">
      <a href="#" class="logo">MUSTACHE<span>PODS</span></a>
      <div class="nav-actions">
        <button class="btn-auth-trigger" id="user-btn">Entrar</button>
        <button class="cart-trigger">Carrinho</button>
      </div>
    </nav>
  </header>

  <section class="hero">
    <h1>Premium Vape Store</h1>
    <p>Os melhores modelos e os sabores mais procurados do mercado.</p>
  </section>

  <main>
    <div class="grid">
      <!-- Exemplo de Produto -->
      <div class="card">
        <div class="card-title">Elfbar BC 5000 Puffs</div>
        <div class="price">R$ 25,00</div>
        <button class="btn-add">Adicionar ao Carrinho</button>
      </div>
    </div>
  </main>

</body>
</html>
